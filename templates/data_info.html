{% extends "base.html" %}
{% block title %}Data Info — GEORGIN{% endblock %}
{% block content %}
<h5 class="mb-3"><i class="bi bi-database"></i> Data Tables (Year: {{ year }})</h5>
<p class="text-muted small">Data directory: {{ data_dir }}</p>
<div class="row row-cols-2 row-cols-md-4 g-2">
{% for t in info %}
<div class="col">
  <div class="card py-2 px-3 {% if t.has_data %}border-success{% else %}border-secondary{% endif %}">
    <div class="fw-bold" style="font-size:0.8rem">{{ t.table }}</div>
    <div class="text-muted small">{{ t.count }} records</div>
  </div>
</div>
{% endfor %}
</div>
{% endblock %}
