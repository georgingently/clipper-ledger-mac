{% extends "base.html" %}
{% block title %}{{ action }} Account — GEORGIN{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="mb-0"><i class="bi bi-person-plus"></i> {{ action }} Account</h5>
  <a href="/accounts/" class="btn btn-sm btn-outline-secondary">Back</a>
</div>
<div class="card" style="max-width:700px">
  <div class="card-body">
    <form method="post">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Account Code *</label>
          <input type="text" name="ac_code" class="form-control form-control-sm upper"
            value="{{ acc.AC_CODE or '' }}" maxlength="6" {% if action=='Edit' %}readonly{% endif %} required>
        </div>
        <div class="col-md-9">
          <label class="form-label">Account Name *</label>
          <input type="text" name="ac_head" class="form-control form-control-sm upper"
            value="{{ acc.AC_HEAD or '' }}" maxlength="30" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Group Code</label>
          <select name="ac_grcd" class="form-select form-select-sm">
            <option value="">-- Select --</option>
            {% for g in groups %}
            <option value="{{ g.GRCD }}" {% if g.GRCD == (acc.AC_GRCD or '') %}selected{% endif %}>
              {{ g.GRCD }} — {{ g.GRHD }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">City</label>
          <input type="text" name="city" class="form-control form-control-sm upper"
            value="{{ acc.CITY or '' }}" maxlength="25">
        </div>
        <div class="col-md-4">
          <label class="form-label">GST / ST No</label>
          <input type="text" name="stno" class="form-control form-control-sm"
            value="{{ acc.STNO or '' }}" maxlength="25">
        </div>
        <div class="col-12">
          <label class="form-label">Address Line 1</label>
          <input type="text" name="addr1" class="form-control form-control-sm upper"
            value="{{ acc.ADDR1 or '' }}" maxlength="30">
        </div>
        <div class="col-12">
          <label class="form-label">Address Line 2</label>
          <input type="text" name="addr2" class="form-control form-control-sm upper"
            value="{{ acc.ADDR2 or '' }}" maxlength="30">
        </div>
        <div class="col-md-6">
          <label class="form-label">Remark</label>
          <input type="text" name="remark" class="form-control form-control-sm upper"
            value="{{ acc.REMARK or '' }}" maxlength="20">
        </div>
        <div class="col-md-3">
          <label class="form-label">Credit Limit (Days)</label>
          <input type="number" name="crli" class="form-control form-control-sm"
            value="{{ acc.CRLI or 0 }}" min="0">
        </div>
        <div class="col-md-3">
          <label class="form-label">Amt Received</label>
          <input type="number" name="amtrcd" step="0.01" class="form-control form-control-sm"
            value="{{ acc.AMTRCD or 0 }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Opening Balance</label>
          <input type="number" name="yearop" step="0.01" class="form-control form-control-sm"
            value="{{ acc.YEAROP or 0 }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Current Balance</label>
          <input type="number" name="curbal" step="0.01" class="form-control form-control-sm"
            value="{{ acc.CURBAL or 0 }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Budget</label>
          <input type="number" name="budget" step="0.01" class="form-control form-control-sm"
            value="{{ acc.BUDGET or 0 }}">
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary btn-sm">
            <i class="bi bi-save"></i> {{ action }} Account
          </button>
          <a href="/accounts/" class="btn btn-secondary btn-sm ms-2">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
