{% extends "base.html" %}
{% block title %}{{ action }} Group — GEORGIN{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="mb-0"><i class="bi bi-diagram-3"></i> {{ action }} Group</h5>
  <a href="/accounts/groups" class="btn btn-sm btn-outline-secondary">Back</a>
</div>
<div class="card" style="max-width:400px">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Group Code *</label>
        <input type="text" name="grcd" class="form-control form-control-sm upper"
          value="{{ grp.GRCD or '' }}" maxlength="4"
          {% if action=='Edit' %}readonly{% endif %} required>
      </div>
      <div class="mb-3">
        <label class="form-label">Group Name *</label>
        <input type="text" name="grhd" class="form-control form-control-sm upper"
          value="{{ grp.GRHD or '' }}" maxlength="20" required>
      </div>
      <button type="submit" class="btn btn-primary btn-sm"><i class="bi bi-save"></i> Save</button>
      <a href="/accounts/groups" class="btn btn-secondary btn-sm ms-2">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
